const { useState, useRef, useEffect } = React;

// 実物メールHTMLを iframe で埋め込み、コンテンツ高さに自動リサイズ（same-origin）
function EmailIframe({src}) {
  const ref = useRef(null);
  useEffect(() => {
    const iframe = ref.current;
    if (!iframe) return;
    const resize = () => {
      try {
        const h = iframe.contentDocument.body.scrollHeight + 24;
        iframe.style.height = h + "px";
      } catch (e) {}
    };
    iframe.addEventListener("load", resize);
    // 念のため少し遅らせて再計測（webfont読込後）
    const t1 = setTimeout(resize, 300);
    const t2 = setTimeout(resize, 1200);
    return () => {
      iframe.removeEventListener("load", resize);
      clearTimeout(t1); clearTimeout(t2);
    };
  }, [src]);
  return (
    <iframe
      ref={ref}
      src={src}
      title="実物メールHTML"
      style={{width:"100%",minHeight:600,border:"1px solid #E8E4DE",borderRadius:8,background:"#F1ECE4",display:"block"}}
    />
  );
}

function HtmlTemplate({n}){
  if(!n.realEmail) return(
    <div style={{background:"#F5F3EE",borderRadius:12,padding:40,textAlign:"center",color:"#999",fontSize:13}}>

    <div style={{background:"#FAF8F5",border:"1px solid #E8E4DE",borderRadius:12,overflow:"hidden"}}>
      <div style={{background:"#EDF2F8",padding:"10px 20px",borderBottom:"1px solid #DCE3EC",fontSize:12.5,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>

      </div>
      <EmailIframe src={n.realEmail} />
    </div>
  );
}
