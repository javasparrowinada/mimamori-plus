            <div><div style={{fontSize:10,fontWeight:600,color:"#1C1C1E"}}>森川あかり</div><div style={{fontSize:8,color:"#8E8E93"}}>見守りプラス サポート担当</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Empty({label}){
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100%",background:"#F2F2F7",padding:20,textAlign:"center"}}>
    <div style={{fontSize:24,marginBottom:8,opacity:.25}}>─</div>
    <div style={{fontSize:12,fontWeight:600,color:"#8E8E93"}}>{label}</div>
    <div style={{fontSize:10,color:"#AEAEB2",marginTop:3}}>この通知では使用しません</div>
  </div>;
}

function HtmlTemplate({n}){
  if(!n.email) return(
    <div style={{background:"#F5F3EE",borderRadius:12,padding:40,textAlign:"center",color:"#999",fontSize:13}}>
      この通知にメールテンプレートはありません<br/>（プッシュ通知のみ）
    </div>
  );
  const e = n.email;
  return(
    <div style={{background:"#FAF8F5",border:"1px solid #E8E4DE",borderRadius:12,overflow:"hidden"}}>
      <div style={{background:"#F5F5F5",padding:"12px 20px",borderBottom:"1px solid #E0E0E0",fontSize:13,color:"#666"}}>
        <strong style={{color:"#333"}}>件名：</strong>{e.subject}
      </div>
      <div style={{padding:"24px 24px",background:"#fff"}}>
        <div style={{maxWidth:520,margin:"0 auto",border:"1px solid #E8E4DE",borderRadius:8,background:"#fff"}}>
          <div style={{padding:"28px 28px 12px"}}>
            <div style={{fontSize:15,lineHeight:1.9,color:"#333",whiteSpace:"pre-line"}}>{e.body}</div>
          </div>
          <div style={{padding:"0 28px"}}><div style={{color:"#ccc",fontSize:13,letterSpacing:3}}>━━━━━━━━━━━━━━━━━━━━</div></div>
          <div style={{padding:"12px 28px 0"}}><span style={{fontSize:14,fontWeight:700,color:"#E8943A"}}>{e.section}</span></div>
          <div style={{padding:"6px 28px 0"}}><div style={{color:"#ccc",fontSize:13,letterSpacing:3}}>━━━━━━━━━━━━━━━━━━━━</div></div>
          <div style={{padding:"12px 28px 0"}}>
            <div style={{background:"#F7F5F0",border:"1px solid #E8E4DE",borderRadius:8,padding:"14px 18px"}}>
              <table style={{width:"100%",fontSize:14}}><tbody>
                {e.data.map(([k,v],i)=><tr key={i}><td style={{padding:"5px 0",color:"#888",width:140}}>{k}</td><td style={{padding:"5px 0"}}>{v}</td></tr>)}
              </tbody></table>
            </div>
          </div>
          {e.extra&&(<>
            <div style={{padding:"16px 28px 0"}}><div style={{color:"#ccc",fontSize:13,letterSpacing:3}}>━━━━━━━━━━━━━━━━━━━━</div></div>
            <div style={{padding:"12px 28px 0"}}><span style={{fontSize:14,fontWeight:700,color:"#E8943A"}}>{e.extra.emoji} {e.extra.title}</span></div>
            <div style={{padding:"6px 28px 0"}}><div style={{color:"#ccc",fontSize:13,letterSpacing:3}}>━━━━━━━━━━━━━━━━━━━━</div></div>
            <div style={{padding:"10px 28px 0",fontSize:14,lineHeight:1.9}}>{e.extra.items.map((x,i)=><div key={i}>・{x}</div>)}</div>
          </>)}
          {e.cta&&<div style={{textAlign:"center",padding:"20px 28px 0"}}><div style={{display:"inline-block",background:e.ctaColor||"#E8943A",color:"#fff",fontSize:14,fontWeight:700,padding:"12px 28px",borderRadius:6}}>▼ アプリで詳細を確認する</div></div>}
          <div style={{padding:"24px 28px 0"}}>
            <div style={{fontSize:13,color:"#999"}}>何かあればお気軽にご連絡ください</div>
            <div style={{fontSize:13,color:"#666",marginTop:3}}>💬 LINE：@741gbrqo ／ 📞 0120-407-700</div>
          </div>
          <div style={{padding:"16px 28px 0"}}><hr style={{border:"none",borderTop:"1px solid #E8E4DE"}}/></div>
          <div style={{padding:"14px 28px 24px",display:"flex",alignItems:"center",gap:10}}>
            <img src="akari.png" alt="あかり" style={{width:36,height:36,borderRadius:18,objectFit:"cover",border:"1px solid #F5E6D0"}}/>
            <div><div style={{fontSize:14,fontWeight:700,color:"#333"}}>森川あかり</div><div style={{fontSize:12,color:"#888"}}>見守りプラス サポート担当</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [idx,setIdx]=useState(0);
  const n = allNotifications[idx];

  const groups=[
    {label:"緊急通知",color:"#D32F2F",ids:["t1","t1r","t2","t2r","t3","t4"]},
    {label:"見守り通知",color:"#757575",ids:["w1","w2","w3","w4","w5"]},
  ];

  return(
    <div style={{minHeight:"calc(100vh - 60px)",background:"#EDEBE6",fontFamily:"-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Sans',sans-serif",padding:"24px 12px"}}>

      <div style={{textAlign:"center",marginBottom:20}}>
        <h1 style={{fontSize:17,fontWeight:700,color:"#1C1C1E",margin:0}}>見守りプラス 通知テンプレート一覧</h1>
        <p style={{fontSize:11,color:"#8E8E93",marginTop:4}}>HTMLメール本文とスマホUIを同時に確認できます</p>
      </div>

      {groups.map(g=>(
        <div key={g.label} style={{marginBottom:12}}>
          <div style={{textAlign:"center",fontSize:11,fontWeight:600,color:g.color,marginBottom:6}}>{g.label}</div>
          <div style={{display:"flex",justifyContent:"center",gap:5,flexWrap:"wrap",maxWidth:700,margin:"0 auto"}}>
            {g.ids.map(id=>{
              const ni = allNotifications.findIndex(x=>x.id===id);
              const item = allNotifications[ni];
              const sel = idx===ni;
              return(
                <button key={id} onClick={()=>setIdx(ni)} style={{
                  border:sel?`2px solid ${item.badgeColor}`:"1px solid #D5D0C8",
                  borderRadius:8,padding:"5px 10px",fontSize:11,
                  fontWeight:sel?700:400,color:sel?item.badgeColor:"#666",
                  background:sel?"#fff":"#F5F3EE",cursor:"pointer",position:"relative",
                }}>
                  {item.label}
                  {item.isNew&&<span style={{position:"absolute",top:-6,right:-6,background:"#D32F2F",color:"#fff",fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:6}}>NEW</span>}
                </button>
              );
            })}
          </div>
        </div>
      ))}

      <div style={{maxWidth:1100,margin:"20px auto 12px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{display:"inline-block",padding:"3px 10px",borderRadius:10,fontSize:11,fontWeight:700,color:"#fff",background:n.badgeColor}}>{n.badge}</span>
        <span style={{fontSize:15,fontWeight:700,color:"#1C1C1E"}}>{n.label}</span>
        <span style={{fontSize:12,color:"#8E8E93"}}>── {n.trigger}</span>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>

        <div style={{flex:"1 1 480px",minWidth:320}}>
          <div style={{fontSize:12,fontWeight:600,color:"#1C1C1E",marginBottom:8}}>✉️ HTMLメールテンプレート</div>
          <HtmlTemplate n={n}/>
        </div>

        <div style={{flex:"0 0 auto"}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {[
              {label:"🔔 プッシュ",comp:<PushUI d={n.push}/>},
              {label:"💬 LINE",comp:<LineUI d={n.line}/>},
              {label:"✉️ メール",comp:<MailUI d={n.email}/>},
            ].map((ch,i)=>(
              <div key={i}>
                <div style={{fontSize:11,fontWeight:600,color:"#1C1C1E",marginBottom:6,textAlign:"center"}}>{ch.label}</div>
                <IPhone h={380}>{ch.comp}</IPhone>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
