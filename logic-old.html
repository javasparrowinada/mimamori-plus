<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見守りプラス｜テンプレート選択ロジック解説</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#FFF8F0;--warm:#F5E6D3;--orange:#E8834A;--orange-dark:#D06830;--green:#5B8C5A;--green-light:#E8F0E4;--green-dark:#3D6B3C;--text:#2D2A26;--text-light:#6B6560;--white:#FFFFFF;--red:#D65050;--red-light:#FFF0F0;--blue:#5A7EB5;--blue-light:#EDF2F8;--shadow:0 4px 24px rgba(45,42,38,.06)}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;color:var(--text);background:#F5F3F0;line-height:1.85;font-size:15px}
.topbar{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid rgba(0,0,0,.06);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-brand{font-weight:900;font-size:.85rem;color:var(--green-dark)}
.topbar-brand a{color:inherit;text-decoration:none}
.topbar-nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.topbar-nav a{font-size:.72rem;font-weight:700;color:var(--text-light);text-decoration:none;padding:6px 12px;border-radius:100px;transition:all .2s}
.topbar-nav a:hover,.topbar-nav a.active{background:var(--green-light);color:var(--green-dark)}
.topbar-sheet{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--white)!important;background:#1D9E75;padding:6px 14px!important;border-radius:100px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.topbar-sheet:hover{background:#157d5c!important}
.topbar-cta{font-size:.72rem;font-weight:700;color:var(--white)!important;background:var(--orange);padding:6px 14px!important;border-radius:100px;text-decoration:none}
.topbar-cta:hover{background:var(--orange-dark)!important}
.header{background:linear-gradient(135deg,var(--green-dark),var(--green));color:var(--white);padding:48px 24px 40px;text-align:center}
.header h1{font-size:clamp(1.2rem,3.5vw,1.7rem);font-weight:900;margin-bottom:8px}
.header p{opacity:.8;font-size:.88rem;font-weight:300;max-width:700px;margin:0 auto}
.header-meta{margin-top:20px;font-size:.72rem;opacity:.65;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.header-meta a{color:var(--white);text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);text-underline-offset:3px}
.header-meta a:hover{text-decoration-color:rgba(255,255,255,.9)}
.main{max-width:1100px;margin:0 auto;padding:32px 20px 80px}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:50;background:#F5F3F0;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.tab{padding:10px 18px;border-radius:100px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .25s;border:2px solid rgba(0,0,0,.08);background:var(--white);color:var(--text-light);user-select:none}
.tab:hover{border-color:var(--green);color:var(--green-dark)}
.tab.active{background:var(--green-dark);color:var(--white);border-color:var(--green-dark)}

.pattern-panel{display:none}.pattern-panel.active{display:block}

/* Cards */
.card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px;border:1px solid rgba(0,0,0,.04)}
.card h3{font-size:.95rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Step flow */
.step{margin-bottom:28px}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:900;color:var(--white);flex-shrink:0}
.step-num-green{background:var(--green-dark)}.step-num-orange{background:var(--orange)}.step-num-blue{background:var(--blue)}.step-num-red{background:var(--red)}
.step-title{font-size:.88rem;font-weight:700}
.step-sheet{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:100px;background:var(--green-light);color:var(--green-dark)}

/* Logic table */
.logic-tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin:8px 0}
.logic-tbl th{text-align:left;padding:8px 12px;font-weight:700;font-size:.72rem;background:rgba(45,42,38,.04);border-bottom:2px solid rgba(0,0,0,.1);color:var(--text-light);letter-spacing:.05em}
.logic-tbl td{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:top}
.logic-tbl .cell-ref{font-family:monospace;font-size:.75rem;color:var(--blue);font-weight:600;background:var(--blue-light);padding:2px 6px;border-radius:4px;white-space:nowrap}
.logic-tbl .val{font-weight:700;color:var(--green-dark)}
.logic-tbl .val-warn{font-weight:700;color:var(--orange)}
.logic-tbl .val-alert{font-weight:700;color:var(--red)}
.logic-tbl .formula{font-family:monospace;font-size:.72rem;color:var(--text-light);background:#F5F3F0;padding:2px 6px;border-radius:4px}

/* Arrow */
.arrow-down{text-align:center;margin:8px 0;font-size:1.2rem;color:var(--green)}

/* Result box */
.result-box{border-radius:10px;padding:14px 18px;margin:10px 0;font-size:.84rem;line-height:1.9;white-space:pre-line}
.result-mail{background:var(--blue-light);border:1px solid rgba(90,126,181,.15)}
.result-line{background:#E8F8E8;border:1px solid rgba(6,168,68,.12)}
.result-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;margin-bottom:6px;display:block}
.result-label-mail{color:var(--blue)}.result-label-line{color:#06A844}

/* Highlight selected */
.hl{background:linear-gradient(to right,#FFF9E6,#FFFDF5);border-left:3px solid var(--orange);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.hl-label{font-size:.68rem;font-weight:700;color:var(--orange);margin-bottom:4px}

/* Badge */
.badge{display:inline-flex;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.03em}
.bg{background:var(--green-light);color:var(--green-dark)}.bo{background:#FFF3E8;color:var(--orange-dark)}.br{background:var(--red-light);color:var(--red)}.bb{background:var(--blue-light);color:var(--blue)}.bgr{background:#F0EFED;color:var(--text-light)}

/* Data input mini table */
.input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px;margin:8px 0}
.input-item{background:#FAFAF7;border-radius:6px;padding:6px 10px;font-size:.75rem;border:1px solid rgba(0,0,0,.04)}
.input-item .il{color:var(--text-light)}.input-item .iv{font-weight:700;color:var(--text)}

.divider{height:1px;background:rgba(0,0,0,.06);margin:28px 0}
.final-output{background:var(--white);border:2px solid var(--green);border-radius:14px;padding:24px;margin-top:20px}
.final-output h3{color:var(--green-dark);margin-bottom:16px}

@media(max-width:640px){.input-grid{grid-template-columns:1fr 1fr}.logic-tbl{font-size:.75rem}}
</style>
</head>

      why:"パターン④と同じNONEだが、バリエーション2を選択。「ご様子が少し気になります。お電話してみてはいかがでしょうか」。\nパターン④のバリエーション1「お変わりないとは思いますが」より踏み込んだ表現。\n接続CONCERN + 応答NONE の組み合わせでは、柔らかいフォローより率直な促しを優先。",
      selected:`4回のライトの確認にお返事がない状態です。お母さんのご様子が少し気になります。お電話してみてはいかがでしょうか。`
    },
    {
      num:"④",color:"step-num-green",
      title:"見守りメモ（自動生成）",
      sheet:"数値からの自動組み立て",
      lookup:"ゼロでない項目だけ表示",
      match_row:"plug_days>0 → 表示 / light_days==0 → 非表示 / check_replied==0 → 非表示",
      why:"パターン④と同じくコンセント接続のみ表示。ただし10/31日で✅なし。\nパターン④は31/31日✅だったので、視覚的に「コンセントすら不安定」が伝わる。\nこの1行の差が、パターン④（安心寄り）と⑤（要注意）の違いを如実に示す。",
      selected:`コンセント接続　｜ 10 / 31日`
    },
    {
      num:"⑤",color:"step-num-orange",
      title:"締めテンプレート",
      sheet:"⑥締めテンプレート",
      lookup:"季節=夏, フェーズ=VETERAN（汎用テンプレート使用）",
      match_row:"夏の汎用バリエーション1を選択",
      why:"パターン①と同じ「夏」テンプレだが、総評とブロック③が深刻なので、締めの「水分補給も気にかけて」が別のニュアンスを帯びる。テンプレート自体は同じでも、前のブロックとの文脈で読み味が変わる例。",
      selected:`暑い日が続きますので、お母さんの水分補給も気にかけてあげてくださいね。\n何かありましたら、いつでもご連絡ください。`
    },
  ],
  line_block:{
    sheet:"⑦LINE隔週テンプレート → ⑧LINEアラート（深刻なため通常レポートよりアラート寄り）",
    lookup:"接続=CONCERN, 活動=NONE → 通常の隔週レポートではなくアラート寄りテンプレートを使用",
    match_row:"CONCERN_NONE_OKを選択",
    why:"CONCERN × NONE → LINEでは最も強いトーン。\n冒頭が「😊」ではなく「🙏」で始まる。\n「ここ2週間ほど使われていないようです」「お電話でご様子を伺ってみてください🙏」と、明確な行動依頼。\n\nパターン①: 「お元気そうです✨ ご安心くださいね💛」\nパターン④: 「お出かけかも。よかったらお電話で💛」\nパターン⑤: 「使われていません。お電話でご様子を伺ってください🙏」\n\n絵文字の変化（💛→🙏）とフレーズの強さが段階的に上がっている。",
    selected:`高橋さん、あかりです🙏\n\nお母さんのsolarich\nここ2週間ほど\n使われていないようです\n\nコンセントも外れている日が\n多くなっています\n\nお電話で\nご様子を伺ってみてください🙏`
  }
}
];

// Render
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

P.forEach((p, idx) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx===0?' active':'');
  tab.textContent = p.tab;
  tab.dataset.id = p.id;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===p.id));
    document.querySelectorAll('.pattern-panel').forEach(pp=>pp.classList.toggle('active',pp.id===p.id));
  };
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'pattern-panel'+(idx===0?' active':'');
  panel.id = p.id;

  // Build input grid
  const inputsHtml = p.inputs.map(i=>`<div class="input-item"><span class="il">${i.l}</span><br><span class="iv">${i.v}</span> <span class="cell-ref" style="font-size:.65rem">①${i.ref}</span></div>`).join('');

  // Build judgments table
  const judgeRows = p.judgments.map(j=>`<tr><td>${j.axis}</td><td><span class="formula">${j.formula}</span></td><td><span class="badge ${j.cls}">${j.result}</span></td><td style="font-size:.78rem;color:var(--text-light)">${j.reason}</td></tr>`).join('');

  // Build blocks
  const blocksHtml = p.blocks.map(b=>`
    <div class="step">
      <div class="step-header">
        <div class="step-num ${b.color}">${b.num}</div>
        <span class="step-title">${b.title}</span>
        <span class="step-sheet">${b.sheet}</span>
      </div>
      <table class="logic-tbl">
        <tr><th>検索キー</th><th>一致行</th></tr>
        <tr><td>${b.lookup}</td><td>${b.match_row}</td></tr>
      </table>
      <div class="hl">
        <div class="hl-label">▼ なぜこのテンプレートが選ばれたか</div>
        <div style="font-size:.82rem;line-height:1.8;white-space:pre-line">${b.why}</div>
      </div>
      <div class="result-box result-mail">
        <span class="result-label result-label-mail">選択されたテンプレート（プレースホルダー置換後）</span>
        ${b.selected}
      </div>
    </div>
  `).join('<div class="arrow-down">↓</div>');

  // LINE block
  const lineHtml = `
    <div class="step">
      <div class="step-header">
        <div class="step-num" style="background:#06C755">L</div>
        <span class="step-title">LINE隔週レポート</span>
        <span class="step-sheet">${p.line_block.sheet}</span>
      </div>
      <table class="logic-tbl">
        <tr><th>検索キー</th><th>一致行</th></tr>
        <tr><td>${p.line_block.lookup}</td><td>${p.line_block.match_row}</td></tr>
      </table>
      <div class="hl">
        <div class="hl-label">▼ なぜこのテンプレートが選ばれたか</div>
        <div style="font-size:.82rem;line-height:1.8;white-space:pre-line">${p.line_block.why}</div>
      </div>
      <div class="result-box result-line">
        <span class="result-label result-label-line">選択されたLINEテンプレート</span>
        ${p.line_block.selected}
      </div>
    </div>
  `;

  panel.innerHTML = `
    <div class="card">
      <h3>📋 ${p.title}</h3>
      <p style="font-size:.84rem;color:var(--text-light);margin-bottom:16px">${p.desc}</p>
      
      <h3 style="margin-top:20px">📥 STEP 1：入力データ <span class="step-sheet">①入力データ シート</span></h3>
      <p style="font-size:.78rem;color:var(--text-light);margin-bottom:8px">黄色セル（D列）に入っている値。これが全ての判定の起点。</p>
      <div class="input-grid">${inputsHtml}</div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="card">
      <h3>⚙️ STEP 2：判定ロジック <span class="step-sheet">②判定ロジック シート</span></h3>
      <p style="font-size:.78rem;color:var(--text-light);margin-bottom:8px">入力値を数式で自動判定。各軸ごとにレベルを振り分ける。</p>
      <table class="logic-tbl">
        <tr><th style="width:14%">判定軸</th><th style="width:28%">判定式</th><th style="width:12%">結果</th><th>なぜこの結果になったか</th></tr>
        ${judgeRows}
      </table>
      <div style="margin-top:12px;padding:10px 14px;background:var(--cream);border-radius:8px;font-size:.82rem">
        <strong>総合キー：</strong><span style="color:var(--red);font-weight:900;font-size:.95rem">${p.combined_key}</span>
        <span style="margin-left:12px;color:var(--text-light)">フルキー：${p.full_key}</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="card">
      <h3>📝 STEP 3：メール テンプレート選択 <span class="step-sheet">③〜⑥シート</span></h3>
      <p style="font-size:.78rem;color:var(--text-light);margin-bottom:16px">判定結果をキーにして各シートからテンプレートを取得。5ブロックを順に組み立てる。</p>
      ${blocksHtml}
    </div>

    <div class="divider"></div>

    <div class="card">
      <h3>💬 STEP 4：LINE テンプレート選択 <span class="step-sheet">⑦⑧シート</span></h3>
      <p style="font-size:.78rem;color:var(--text-light);margin-bottom:16px">メールと同じ判定結果を使うが、LINE用の短い文面テンプレートから選択。</p>
      ${lineHtml}
    </div>
  `;

  panelsEl.appendChild(panel);
});
</script>
</body>
</html>
